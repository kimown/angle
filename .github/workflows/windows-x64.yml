name: windows-x64

on: 
  push:
    branches: [ mybranch87_0_4272_0 ]

env:
  PYTHONPATH: D:\a\angle\angle\build;

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: info1
        shell: cmd
        run: |
          cmd /c "echo hello_clean1"
      - name: Install Required Dependencies
        if: true
        shell: cmd
        run: |
          curl -sOL https://aka.ms/vs/16/release/vs_community.exe
          .\vs_community.exe --passive --wait --norestart --nocache --installPath "%ProgramFiles(x86)%\Microsoft Visual Studio\2019\Community" --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64
      - name: info2
        shell: bash
        run: |
          echo hello_clean2
          ls 
          pwd
          rm -rf *
          ls "/c/Program Files (x86)/Microsoft Visual Studio/2019/Community"
          echo hello_clean2
      - name: Checkout sources
        run: |
          git clone https://github.com/kimown/angle .
          git checkout mybranch87_0_4272_0
      - name: Fetchfea depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
      - name: Install Python3 to D
        run: |
          curl -LO https://github.com/ServBay/Python-Windows-Portable/releases/download/python-3.9.13-win-x64/python-3.9.13-win-x64.zip
          mkdir D:\a\angle\angle\python3
          powershell -Command "Expand-Archive -Path python-3.9.13-win-x64.zip -DestinationPath D:\a\angle\angle\python3"
      - name: info3
        shell: bash
        run: |
          ls 
          pwd
          ls "/d/a/angle/angle/python3/x64"
      - name: Build with pwsl
        if: true
        run: |
          python --version
          python3 -c "import os;print(os.environ)"
          python -c "import sys;import os;print(sys.path);print(os.environ['PYTHONPATH']);print(os.environ['PATH'])"

          # https://github.com/cybik/angle-bootstraps/blob/88076a961fb9be081793379b41ecba33ea51f914/.github/workflows/windows.yml#L21
          $env:DEPOT_TOOLS_WIN_TOOLCHAIN=0
          $env:Path = "$pwd\depot_tools;" + $env:Path
          $env:Path = "$pwd\python3\x64;" + $env:Path
          $env:PYTHONPATH = "$pwd\build"
          $env:vs2019_install = "C:\Program Files (x86)\Microsoft Visual Studio\2019\Community"
          $env:WINDOWSSDKDIR = "C:\Program Files (x86)\Windows Kits\10"

          python --version
          python3 -c "import os;print(os.environ)"
          python -c "import sys;import os;print(sys.path);print(os.environ['PYTHONPATH']);print(os.environ['PATH'])"
          
          echo "gclient_start"
          gclient
          echo "gclient_end"
          python scripts/bootstrap.py
          echo "bootstrap_end"
          
          gclient sync
          echo "sync_end"

          # patch file in build repo
          cd build
          curl -LO https://raw.githubusercontent.com/kimown/angle/refs/heads/mybranch87_0_4272_0/.github/Fix_gn_gen_with_python3_and_the_Windows_toolchain_on_a_other_drive___In_python3_map_re.patch
          git inin
          type toolchain/win/setup_toolchain.py
          echo "type_end"
          git apply Fix_gn_gen_with_python3_and_the_Windows_toolchain_on_a_other_drive___In_python3_map_re.patch
          type toolchain/win/setup_toolchain.py
          echo "type_patch_end"
          cd ..


          gn gen out/Release --args="is_debug=false angle_build_all=false"
          echo "gen_end"
          autoninja -C out/Release
          echo "ninja_end"          
      - name: Pack
        shell: bash
        run: |
          mkdir angle-windows-x64
          mkdir angle-windows-x64/dist
          rm -rf out/Release/cdb
          rm -rf out/Release/gen
          rm -rf out/Release/obj
          rm -rf out/Release/args.gn
          rm -rf out/Release/build.ninja
          rm -rf out/Release/build.ninja.d
          rm -rf out/Release/toolchain.ninja
          rm -rf out/Release/environment.*
          find out/Release -name "*.pdb" -delete
          mv -f out/Release/* angle-windows-x64/dist/
          cp -rf include angle-windows-x64/
          find angle-windows-x64 -name ".clang-format" -delete
          find angle-windows-x64 -name "*.md" -delete
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-windows-x64
          path: angle-windows-x64